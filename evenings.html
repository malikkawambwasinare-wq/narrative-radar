<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Evenings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The Company (Nov 2026): a light, quiet room where the people in the story
     are the design. Chosen by Malik from three directions; the dark console it
     replaces is kept at archive/evenings-v1.html. */
  :root {
    color-scheme: light;
    --ground: #eceee8; --deep: #e2e5de; --glass: #f6f7f3; --glass-2: #ffffff;
    --edge: #d6dad3; --edge-2: #c3c8c0;
    --ink: #1c2321; --ink-2: #4a5350; --muted: #5f6865;
    --accent: #1f6f66; --accent-ink: #f2f6f3; --signal: #b8601b;
    --boom: #2f5fc4; --both: #7c8580; --bubble: #b8601b;
    --p1a: #2b4a8a; --p1b: #1a2c55; --p2a: #8a3a2a; --p2b: #4a1d14; --p3a: #1f6f66; --p3b: #10403a;
    --p4a: #5a4a8a; --p4b: #2f2550; --p5a: #8a6a22; --p5b: #4a380f;
    --display: "Bricolage Grotesque", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--body); }
  .wrap { max-width: 960px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 64px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--display); }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
  .brand .orb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .ghost { background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 8px 15px; font-size: 13px; color: var(--ink); backdrop-filter: blur(8px); }
  .ghost:hover { border-color: var(--edge-2); background: var(--glass-2); }
  .ghost:disabled { opacity: .4; cursor: default; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 22px; font-size: 14.5px; font-weight: 600; font-family: var(--display); }
  .primary:hover { background: #14524b; }
  .chip { background: var(--glass); border: 1px solid var(--edge); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--edge); color: var(--ink-2); }
  .pill.ok { border-color: var(--accent); color: var(--accent); }

  /* ---- the two sides of the product ---- */
  .sides { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid var(--edge); margin-bottom: 26px; }
  .sides button { border: 0; background: none; color: var(--ink-2); border-radius: 999px; padding: 8px 18px; font-family: var(--display); font-size: 13.5px; font-weight: 500; }
  .sides button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .sides button small { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; margin-left: 6px; opacity: .7; }
  .soon { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 30px; }
  .soon div { background: var(--glass); border: 1px dashed var(--edge-2); border-radius: 16px; padding: 18px; display: grid; gap: 6px; }
  .soon b { font-family: var(--display); font-size: 17px; font-weight: 600; }
  .soon span { font-size: 13px; color: var(--ink-2); }

  .cats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 34px; }
  .cat { background: var(--glass); border: 1px solid var(--edge); color: var(--ink); border-radius: 12px; padding: 10px 18px; font-family: var(--display); font-size: 15px; font-weight: 500; }
  .cat:hover { border-color: var(--edge-2); }
  .cat[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .cat.empty { color: var(--muted); border-style: dashed; }
  .nothing { color: var(--ink-2); background: var(--glass); border: 1px dashed var(--edge-2); border-radius: 16px; padding: 22px; margin-top: 24px; max-width: 60ch; }

  /* ---- door ---- */
  .door h1 { font-size: clamp(34px, 6.4vw, 60px); font-weight: 500; line-height: 1.02; letter-spacing: -.03em; }
  .door h1 em { font-style: normal; color: var(--accent); }
  .door .lede { font-size: 16.5px; color: var(--ink-2); max-width: 56ch; margin-top: 14px; }
  .budget { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 24px; }
  .section { margin-top: 44px; }
  .kick { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .kick h2 { font-size: 15px; font-weight: 600; }
  .kick .sub { font-size: 12.5px; color: var(--muted); }

  /* the shelf: tonight's evenings standing in space */
  .shelf { display: flex; gap: 16px; overflow-x: auto; padding: 14px 6px 26px; perspective: 1100px; scrollbar-width: thin; }
  .card3 { flex: 0 0 auto; width: 176px; height: 236px; border-radius: 14px; padding: 14px; border: 0; text-align: left; position: relative;
    color: #f4f6fb; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; transform-style: preserve-3d;
    transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); transition: transform .35s ease, box-shadow .35s ease;
    box-shadow: 0 30px 50px -22px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.14); }
  .card3::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 40%, transparent 65%, rgba(255,255,255,.06)); pointer-events: none; }
  .card3:hover { box-shadow: 0 40px 60px -22px rgba(0,0,0,.9), 0 0 0 1px var(--edge-2), inset 0 1px 0 rgba(255,255,255,.2); }
  .card3 .rank { position: absolute; top: 10px; left: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; opacity: .75; }
  .card3 .play { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); color: #06080f; display: grid; place-items: center; font-size: 12px; transform: translateZ(24px); box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .card3 .pk { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  .card3 .pn { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.12; letter-spacing: -.01em; transform: translateZ(14px); }
  .card3 .pf { font-size: 11.5px; opacity: .75; font-variant-numeric: tabular-nums; }
  .g1 { background: linear-gradient(160deg, var(--p1a), var(--p1b)); } .g2 { background: linear-gradient(160deg, var(--p2a), var(--p2b)); }
  .g3 { background: linear-gradient(160deg, var(--p3a), var(--p3b)); } .g4 { background: linear-gradient(160deg, var(--p4a), var(--p4b)); } .g5 { background: linear-gradient(160deg, var(--p5a), var(--p5b)); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; perspective: 1400px; }
  .tile { background: var(--glass); border: 1px solid var(--edge); border-radius: 16px; padding: 18px; text-align: left; display: flex; flex-direction: column; gap: 9px; min-height: 190px;
    transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); transition: transform .3s ease, border-color .3s, background .3s; backdrop-filter: blur(10px); transform-style: preserve-3d; }
  .tile:hover { border-color: var(--edge-2); background: var(--glass-2); }
  .tile .name { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.15; letter-spacing: -.015em; transform: translateZ(10px); }
  .tile .claim { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .tile .meta { margin-top: auto; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-variant-numeric: tabular-nums; }
  .tile.sorting { border-style: dashed; }
  .rules { margin-top: 40px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--edge); padding-top: 16px; max-width: 66ch; }
  @media (prefers-reduced-motion: reduce) { .card3, .tile { transition: none; transform: none !important; } }

  /* ---- series ---- */
  .titlecard { margin-top: 10px; display: grid; gap: 10px; }
  .titlecard h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 500; line-height: 1.05; letter-spacing: -.025em; }
  .titlecard .claim { font-size: 15.5px; color: var(--ink-2); max-width: 64ch; }
  .cta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .cta .note { font-size: 12.5px; color: var(--muted); }
  .curator { display: flex; gap: 10px; align-items: flex-start; background: var(--glass); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); max-width: 70ch; }
  .curator .orb { flex: 0 0 auto; width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--accent); }
  .seen-toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); }

  .rail { position: relative; margin-top: 30px; display: grid; gap: 18px; padding-left: 26px; }
  .rail::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 2px; background: linear-gradient(var(--edge-2), var(--edge)); }
  .ep { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: 16px; padding: 18px; display: grid; gap: 10px; backdrop-filter: blur(10px); }
  .ep::before { content: ""; position: absolute; left: -26px; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: var(--deep); border: 2px solid var(--edge-2); box-shadow: 0 0 0 4px var(--ground); }
  .ep.now { border-color: var(--accent); }
  .ep.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--ground); }
  .ep.done { opacity: .6; } .ep.done::before { background: var(--ink-2); }
  .ep header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ep h3 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
  .ep .why { font-size: 13px; color: var(--ink-2); max-width: 66ch; }
  .ep .mins { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: center; }
  .vlist { display: grid; }
  .v { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 11px 6px; border-top: 1px solid var(--edge); border-radius: 8px; }
  .v .n { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 4px; }
  .v .t { font-size: 15px; font-weight: 600; line-height: 1.3; margin: 2px 0; font-family: var(--display); font-weight: 500; }
  .v .m { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .v .look { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; border-left: 2px solid var(--signal); padding-left: 9px; line-height: 1.45; }
  .v .look b { color: var(--ink); }
  .v.seen .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .v.playing { background: #dfe9e5; }
  .v .tiny { padding: 3px 10px; font-size: 11.5px; }

  /* ---- player ---- */
  .player { display: grid; gap: 14px; margin-top: 8px; }
  .bezel { position: relative; border-radius: 18px; padding: 8px; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); border: 1px solid var(--edge); box-shadow: 0 40px 80px -30px var(--glow, rgba(138,208,255,.35)); }
  .frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; color: #f4f6fb; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 -60px 80px -40px rgba(0,0,0,.6); }
  .frame .ft { font-family: var(--display); font-size: clamp(20px, 3.4vw, 30px); font-weight: 600; line-height: 1.15; max-width: 28ch; letter-spacing: -.015em; }
  .frame .fc { font-size: 13px; opacity: .8; }
  .frame .yt { position: absolute; top: 14px; right: 14px; font-size: 12px; color: #f4f6fb; background: rgba(0,0,0,.4); padding: 6px 11px; border-radius: 999px; text-decoration: none; backdrop-filter: blur(6px); }
  .frame .demo { position: absolute; top: 16px; left: 16px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
  .frame .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.15); }
  .frame .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width .25s linear; }
  @media (prefers-reduced-motion: reduce) { .frame .bar i { transition: none; } }
  .now { display: grid; gap: 4px; padding: 0 4px; }
  .now .line { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .now .spn { color: var(--accent); }
  .now .t { font-family: var(--display); font-size: 18px; font-weight: 500; line-height: 1.3; }
  .now .m { font-size: 12.5px; color: var(--ink-2); }
  .now .look { font-size: 13px; color: var(--ink-2); border-left: 2px solid var(--signal); padding-left: 10px; margin-top: 4px; line-height: 1.5; }
  .now .look b { color: var(--ink); }
  .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .acts .next { font-size: 12.5px; color: var(--muted); }
  .interstitial, .end { background: var(--glass); border: 1px solid var(--edge); border-radius: 18px; padding: 26px; display: grid; gap: 8px; backdrop-filter: blur(10px); }
  .interstitial h3 { font-size: 30px; font-weight: 500; letter-spacing: -.02em; }
  .end h3 { font-size: 34px; font-weight: 500; letter-spacing: -.025em; }
  .end p { margin: 0; color: var(--ink-2); max-width: 60ch; }
  .stat { display: flex; gap: 22px; flex-wrap: wrap; font-variant-numeric: tabular-nums; margin: 6px 0; }
  .stat b { font-family: var(--display); font-size: 26px; font-weight: 500; display: block; line-height: 1.1; }
  .stat span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .fine { font-size: 12.5px; color: var(--muted); }

  /* the viewer: small and docked by default, large on request */
  #dock { position: fixed; z-index: 50; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100vw - 32px));
    padding: 8px; border-radius: 16px; background: var(--ink); color: #eceee8; border: 0;
    box-shadow: 0 24px 60px -24px rgba(28,35,33,.55); transition: opacity .25s, transform .25s; }
  #dock .ghost { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); color: #eceee8; }
  #dock .mono { color: #a9b2ae; }
  #dock.off { opacity: 0; pointer-events: none; transform: translateY(140%); }
  #dock.big { right: auto; bottom: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(960px, calc(100vw - 32px)); }
  #dock.big.off { transform: translate(-50%, 140%); }
  #dock .screen { aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
  #dock .screen { position: relative; }
  #dock .pl { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  #dock .pl.front { opacity: 1; pointer-events: auto; }
  .seg { cursor: pointer; }
  .seg:hover .t { color: var(--accent); }
  #dock .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
  .deeper-btn { border-color: #e0a36d !important; color: #f2c08f !important; white-space: nowrap; }
  #deeper-menu { display: grid; gap: 6px; padding: 10px 2px 2px; max-height: 230px; overflow-y: auto; }
  #deeper-menu .dh { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); }
  #deeper-menu button { text-align: left; background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
  #deeper-menu button:hover { border-color: var(--signal); }
  #deeper-menu b { font-family: var(--display); font-size: 13px; font-weight: 500; }
  #deeper-menu span { font-size: 11.5px; color: var(--ink-2); }
  .dockbar { display: flex; gap: 6px; align-items: center; padding: 8px 2px 0; }
  .dockbar .dtext { flex: 1; min-width: 0; }
  #dock-title { font-family: var(--display); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dock-sub { font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.playing .wrap { padding-bottom: 320px; }
  @media (prefers-reduced-motion: reduce) { #dock { transition: none; } }

  .sorting-view .list { display: grid; gap: 8px; margin-top: 16px; }
  .sorting-view .story { background: var(--glass); border: 1px dashed var(--edge-2); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .sorting-view .story b { font-family: var(--display); font-weight: 500; font-size: 16px; }

  /* ---- The Company: tonight's story, the people in it, and the conversation ---- */
  .tonight { display: grid; gap: 22px; max-width: 640px; }
  .tonight h1 { font-size: clamp(36px, 7vw, 56px); font-weight: 700; line-height: 1.0; letter-spacing: -.025em; }
  .tonight .lede { font-size: 17px; color: var(--ink-2); margin: 8px 0 0; }
  .label { font-size: 13px; color: var(--muted); }
  .lens { display: flex; gap: 8px; flex-wrap: wrap; }
  .lens button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--edge-2); background: transparent; color: var(--ink); font: 500 14px var(--body); }
  .lens button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .lens button:disabled { color: var(--muted); border-style: dashed; cursor: default; }
  .lens button small { font-size: 11px; margin-left: 6px; color: var(--muted); }
  .lens-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .host { border-radius: 18px; background: var(--accent); color: var(--accent-ink); padding: 16px; display: flex; gap: 14px; align-items: center; text-align: left; border: 0; width: 100%; }
  .host .av { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
  .host .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
  .host b { display: block; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; }
  .host span.q { font-size: 14px; opacity: .9; }
  .av { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 2px solid var(--both); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 17px; flex: 0 0 auto; color: var(--ink); }
  .av.sm { width: 44px; height: 44px; font-size: 14px; }
  .room-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .cast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; margin-top: 12px; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
  .person .nm { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
  .person .rl { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
  .join { min-height: 54px; border-radius: 27px; border: 0; background: var(--ink); color: var(--ground); font: 600 16px var(--body); display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
  .join:hover { background: #2c3633; }
  .more { margin-top: 48px; display: grid; gap: 10px; max-width: 640px; }
  .more h2 { font-size: 20px; font-weight: 700; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; background: var(--glass); border: 1px solid var(--edge); border-radius: 14px; padding: 14px 16px; width: 100%; color: var(--ink); }
  .row:hover { border-color: var(--edge-2); background: #fff; }
  .row b { font-family: var(--display); font-weight: 700; font-size: 17px; }
  .row span { font-size: 13px; color: var(--muted); }
  .row .faces { display: flex; }

/* Playback. The video plays in a small viewer docked to the corner, so it
   stays in view while you read the set, and can be made large. One YouTube
   player is created once and kept outside the part of the page that re-renders. */
let yt = null, yt2 = null, ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player("yt", { width: "100%", height: "100%", host: "https://www.youtube-nocookie.com",
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin },
        events: { onReady: () => res(),
          onStateChange: e => { if (state.thread) return threadState(yt, e); if (e.data === YT.PlayerState.ENDED) onEnded(); },
          onError: () => state.thread ? threadError(yt) : onError() } });
      // A second player, hidden behind the first. In a thread it loads the next
      // piece silently while the current one plays, so the change is a swap.
      yt2 = new YT.Player("yt2", { width: "100%", height: "100%", host: "https://www.youtube-nocookie.com",
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin },
        events: { onStateChange: e => threadState(yt2, e), onError: () => threadError(yt2) } });
    };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytReady;
}
const dock = () => document.getElementById("dock");
function dockSync(msg) {
  const p = state.play, d = dock(), t = state.thread;
  if (t && !t.ended) {
    const th = findT(state.story), sg = th.segs[t.i];
    d.classList.remove("off", "big"); document.body.classList.add("threadmode"); document.body.classList.toggle("playing", true);
    document.getElementById("dock-title").textContent = msg || `${speaker(th, t.i).name}: ${sg.label}`;
    const nx = th.segs[t.i + 1];
    document.getElementById("dock-sub").textContent = `Piece ${t.i + 1} of ${th.segs.length} · ${sg.channel} · ${sg.published}` + (nx ? ` · next: ${nx.channel}` : " · last one");
    return;
  }
  document.body.classList.remove("threadmode");
  if (state.one) {
    d.classList.remove("off"); document.body.classList.toggle("playing", !d.classList.contains("big"));
    d.querySelectorAll("[data-deeper-toggle],[data-deeper-back]").forEach(b => b.hidden = true);
    document.getElementById("dock-title").textContent = msg || state.one.title;
    document.getElementById("dock-sub").textContent = state.one.channel + " · full video";
    return;
  }
  const on = !!(p && !p.ended);
  d.classList.toggle("off", !on);
  document.body.classList.toggle("playing", on && !d.classList.contains("big"));
  if (!on) return;
  const ep = p.e.eps[p.ep], v = ep.videos[p.i];
  const deep = deeperFor(p.e.s, v), tog = d.querySelector("[data-deeper-toggle]"), bk = d.querySelector("[data-deeper-back]"), menu = document.getElementById("deeper-menu");
  tog.hidden = !!p.detour || p.interstitial || !deep.length; bk.hidden = !p.detour;
  if (p.detour || !deep.length || p.interstitial) menu.hidden = true;
  if (p.detour) {
    document.getElementById("dock-title").textContent = msg || p.detour.d.label;
    document.getElementById("dock-sub").textContent = `Going deeper · ${p.detour.d.channel} · then back to where you were`;
    return;
  }
  document.getElementById("dock-title").textContent = msg || (p.interstitial ? `${ep.n} · ${ep.title}` : v.title);
  document.getElementById("dock-sub").textContent = p.interstitial ? "Starting…" : `${ep.n} · ${p.i + 1} of ${ep.videos.length} · ${v.channel}`;
}
function startAt(ep, i) {
  clearTimeout(state.play?.timer);
  // The evening is fixed the moment it starts. Marking a video seen must not
  // pull it out from under the player mid-way; it only shapes the next evening.
  let e = state.play?.e || evening(findS(state.story));
  // If everything in this story is marked seen, playing it means watching it
  // again. An empty evening that "ends" at once with 0 videos helps nobody.
  if (!e.count) { const was = state.skipSeen; state.skipSeen = false; e = evening(findS(state.story)); state.skipSeen = was; }
  const cur = state.play = { ep, i, timer: null, ended: false, interstitial: false, e };
  if (!e.eps[ep] || !e.eps[ep].videos.length) return advance(e);
  if (i >= e.eps[ep].videos.length) { cur.i = e.eps[ep].videos.length - 1; return advance(e); }
  store.set("resume." + state.story, { ep, i });
  render();
  const v = e.eps[ep].videos[i];
  loadYT().then(() => { if (state.play === cur) yt.loadVideoById({ videoId: v.id, startSeconds: v.start || 0, ...(v.end ? { endSeconds: v.end } : {}) }); });
}
/* Go deeper. While a "where it stands" video plays, the viewer can step out to a
   short piece that explains something the video takes for granted, and is put
   back exactly where they left. The detour is theirs to take; nothing plays
   that they did not ask for. */
function deeperFor(s, v) { return (v && v.deeper && s.deeper) ? v.deeper.map(k => s.deeper[k]).filter(Boolean) : []; }
function deeperMenu() {
  const p = state.play, menu = document.getElementById("deeper-menu"); if (!p) return;
  if (!menu.hidden) { menu.hidden = true; return; }
  const v = p.e.eps[p.ep].videos[p.i], list = deeperFor(p.e.s, v);
  menu.innerHTML = `<div class="dh">Go deeper · you'll come back to this spot</div>` + list.map((d, k) =>
    `<button data-deeper="${k}"><b>${esc(d.label)}</b><span>${esc(d.why)} · ${Math.max(1, Math.round((d.end - d.start) / 60))} min · ${esc(d.channel)}</span></button>`).join("");
  menu.hidden = false;
}
function deeperGo(k) {
  const p = state.play; if (!p || p.detour) return;
  const v = p.e.eps[p.ep].videos[p.i], d = deeperFor(p.e.s, v)[k]; if (!d) return;
  let at = v.start || 0; try { at = Math.floor(yt.getCurrentTime()); } catch (x) {}
  p.detour = { d, at };
  yt.loadVideoById({ videoId: d.id, startSeconds: d.start, endSeconds: d.end });
  dockSync();
}
function deeperBack() {
  const p = state.play; if (!p || !p.detour) return;
  const v = p.e.eps[p.ep].videos[p.i], at = p.detour.at; p.detour = null;
  yt.loadVideoById({ videoId: v.id, startSeconds: Math.max(0, at - 2), ...(v.end ? { endSeconds: v.end } : {}) });
  dockSync();
}
function onEnded() {
  if (state.play && state.play.detour) return deeperBack(); const p = state.play; if (!p || p.ended || p.interstitial) return; markSeen(p.e.eps[p.ep].videos[p.i]); advance(p.e); }
function onError() {
  const p = state.play; if (!p || p.ended) return;
  dockSync("This video can't be played here. Skipping to the next one…");
  p.timer = setTimeout(() => advance(p.e), 2500);
}
function advance(e) {
  const p = state.play; clearTimeout(p.timer);
  const ep = e.eps[p.ep];
  if (ep && p.i + 1 < ep.videos.length) return startAt(p.ep, p.i + 1);
  let next = p.ep + 1;
  while (next < e.eps.length && !e.eps[next].videos.length) next++;
  if (next < e.eps.length) {
    try { yt && yt.stopVideo(); } catch (x) {}
    state.play = { ep: next, i: 0, timer: null, ended: false, interstitial: true, e: p.e };
    render(); state.play.timer = setTimeout(() => startAt(next, 0), 2200); return;
  }
  try { yt && yt.stopVideo(); } catch (x) {}
  state.play = { ...p, ended: true }; store.del("resume." + state.story); render();
}
const markSeen = v => { if (v) { state.seen.add(v.id); store.set("seen", [...state.seen]); } };
const stop = () => { clearTimeout(state.play?.timer); state.play = null; state.one = null; try { yt && yt.stopVideo(); } catch (x) {} dock().classList.remove("big"); dockSync(); };

/* A thread: short pieces from many videos, each starting at the moment the
   point is made, played back to back. Nothing is cut or stitched: each piece
   plays in YouTube's own player from one second to another. Two players take
   turns, the idle one loading the next piece muted and paused at its start, so
   the change between videos is a swap and not a load. */
const findT = id => DATA.threads.find(t => t.id === id);
const front = () => (state.thread && state.thread.b ? yt2 : yt);
const back = () => (state.thread && state.thread.b ? yt : yt2);
function threadStart(i) {
  const th = findT(state.story); if (!th) return;
  clearInterval(state.thread?.tick);
  state.thread = { i, b: false, tick: null, ready: false };
  render();
  loadYT().then(() => {
    const t = state.thread; if (!t || t.i !== i) return;
    const sg = th.segs[i];
    try { back().stopVideo(); } catch (x) {}
    front().loadVideoById({ videoId: sg.id, startSeconds: sg.start });
    showFront();
    t.tick = setInterval(() => {
      const cur = state.thread; if (!cur) return;
      const s2 = th.segs[cur.i]; let now = 0;
      try { now = front().getCurrentTime(); } catch (x) {}
      if (now >= s2.end - 0.2) threadNext();
    }, 200);
  });
}
function preload(th, j) {
  // Deliberately does nothing. An earlier version loaded the next piece in a
  // hidden, muted player so the change was instant. But a video that starts
  // playing can start an advert, and an advert playing where nobody can see it
  // is exactly what YouTube's rules forbid. One visible player, and the next
  // piece loads when its turn comes.
  const t = state.thread; if (t) t.ready = false;
}
function threadState(pl, e) {
  const t = state.thread; if (!t) return;
  // The hidden player has started the next piece: hold it at its first frame.
  if (pl === back() && e.data === YT.PlayerState.PLAYING && !t.ready) { t.ready = true; pl.pauseVideo(); }
  if (pl === front() && e.data === YT.PlayerState.ENDED) threadNext();
}
function threadError(pl) { if (state.thread && pl === front()) { dockSync("This piece can't be played here. Skipping…"); setTimeout(threadNext, 1500); } }
function showFront() {
  const b = state.thread && state.thread.b;
  document.getElementById("plA").classList.toggle("front", !b);
  document.getElementById("plB").classList.toggle("front", !!b);
}
function threadNext() {
  const t = state.thread, th = findT(state.story); if (!t || !th) return;
  if (t.i + 1 >= th.segs.length) return threadEnd();
  const j = t.i + 1, sg = th.segs[j], old = front();
  if (!t.ready) return threadStart(j);            // the next piece never loaded: start it the plain way
  t.i = j; t.b = !t.b;                            // swap: the hidden player comes forward, already at its start
  try { front().seekTo(sg.start, true); front().unMute(); front().playVideo(); } catch (x) {}
  showFront();
  try { old.pauseVideo(); } catch (x) {}
  render(); preload(th, j + 1);
}
function threadEnd() { clearInterval(state.thread?.tick); try { yt.stopVideo(); yt2.stopVideo(); } catch (x) {} state.thread = { ended: true, i: -1 }; render(); }
function threadStop() { clearInterval(state.thread?.tick); try { yt && yt.stopVideo(); yt2 && yt2.stopVideo(); } catch (x) {} state.thread = null; document.getElementById("plA").classList.add("front"); document.getElementById("plB").classList.remove("front"); }
const mmss = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`;

function threadView(id) {
  const th = findT(id), t = state.thread, m = META[th.id] || {}, cast = castOf(th);
  if (t && t.ended) {
    const k = m.line != null ? m.line : th.segs.length - 1, p = speaker(th, k);
    return topBar(true) + `<section class="closing">
      <div class="label">The end of tonight's conversation</div>
      <h2>That was ${cast.length} people on one question.</h2>
      <div><div class="label">The line of the night</div><blockquote>${esc(th.segs[k].label)}</blockquote><div class="label" style="margin-top:6px">${esc(p.name)}${p.role ? ", " + esc(p.role) : ""}</div></div>
      ${m.ask ? `<div><div class="label">The question to sleep on</div><div class="ask">${esc(m.ask)}</div></div>` : ""}
      <div class="convo-acts" style="margin:0"><button class="stay" data-go="door">Done for tonight</button><button class="alt" data-seg="0">Hear it again</button></div>
    </section>`;
  }
  const cur = t ? t.i : -1;
  const head = `<div class="tonight" style="gap:8px"><div class="label">${t ? `${cur + 1} of ${th.segs.length}` : `${cast.length} people · ${minsOf(th)} min`}</div><h1 style="font-size:clamp(28px,5vw,40px)">${esc(qOf(th))}</h1>
    ${t ? "" : `<button class="join" data-seg="0" style="margin-top:10px"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Join the conversation</button>`}</div>`;
  const turns = th.segs.map((sg, i) => { const p = speaker(th, i), st = i === cur ? "now" : (t && i > cur ? "next" : "");
    const verb = i === cur ? "<em>now speaking</em>" : p.campName ? esc(p.campName.toLowerCase()) : "";
    return `<div class="turn ${st}" data-seg="${i}" role="button" tabindex="0">${avatar(p, "sm")}
      <div><div class="who"><b>${esc(p.name)}</b>${p.role ? " · " + esc(p.role) : ""}${verb ? " · " + verb : ""}</div>
      <div class="ln">${esc(sg.label)}</div><div class="src">${esc(sg.channel)} · ${esc(sg.published)}</div></div></div>`; }).join("");
  let acts = "";
  if (t) {
    const p = speaker(th, cur), sg = th.segs[cur];
    const other = m.camps ? th.segs.findIndex((_, i) => i > cur && speaker(th, i).camp && speaker(th, i).camp !== p.camp) : -1;
    acts = `<div class="convo-acts">${other > 0 ? `<button class="alt" data-seg="${other}">Hear the other side</button>` : ""}
      <a class="stay" href="https://www.youtube.com/watch?v=${esc(sg.id)}&t=${sg.start}s" target="_blank" rel="noopener" data-nojump="1">Keep watching ${esc(p.name.split(" ")[0])} on YouTube ↗</a></div>`;
  }
  return topBar(true) + head + acts + `<div class="convo">${turns}</div>`;
}

/* Background sound, made in the browser so there is no file to load and nothing
   to license. A slow open chord (D, A, E) with one upper note that drifts
   between two pitches, which is what keeps it from sounding finished, and
   under it two low tones 10 Hz apart, one in each ear. Through headphones the
   brain hears that gap as a soft 10 Hz pulse, the range of relaxed, alert
   attention. Whether such tones change how anyone feels is not settled, so the
   page promises a calm sound and nothing more.

   It is off until asked for (browsers do not allow sound before a tap), and it
   fades out whenever a video plays. */
let music = null;
/* The first version was a low drone: three sine tones around 150 to 330 Hz at a
   low level. Laptop and phone speakers barely reproduce that, and an iPhone
   with its silent switch on plays nothing at all from a page, so it could not
   be heard. This version is a small piece of music, written in code:

   - the Lydian mode on D (D E F# G# A B C#). Its raised fourth, G sharp, is
     the note that sounds like a question, which is where the curiosity is;
   - a short melody of eight bell notes at a resting-heart tempo, played twice
     and then changed by one note, so there is something to recognise and
     something new each time round;
   - a warm chord underneath, and two tones 10 Hz apart, one per ear. */
function musicStart() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = new AC();
  // iPhones mute page audio when the silent switch is on, unless a media element is playing.
  try { const a = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="); a.loop = true; a.play().catch(() => {}); } catch (x) {}
  ctx.resume();
  const master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
  const meter = ctx.createAnalyser(); meter.fftSize = 1024; master.connect(meter);
  // a simple hall: two delays feeding each other
  const wet = ctx.createGain(); wet.gain.value = 0.5; wet.connect(master);
  const d1 = ctx.createDelay(2), d2 = ctx.createDelay(2), f1 = ctx.createGain(), f2 = ctx.createGain();
  d1.delayTime.value = 0.41; d2.delayTime.value = 0.63; f1.gain.value = 0.42; f2.gain.value = 0.38;
  d1.connect(f1); f1.connect(d2); d2.connect(f2); f2.connect(d1); d1.connect(wet); d2.connect(wet);
  const bus = ctx.createGain(); bus.connect(master); bus.connect(d1);

  // the chord: D, A, E and F sharp, soft and slowly breathing
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; lp.connect(bus);
  [[146.83, 0.10], [220.0, 0.10], [293.66, 0.09], [329.63, 0.07], [369.99, 0.06]].forEach(([f, lv], k) => {
    const g = ctx.createGain(); g.gain.value = lv; g.connect(lp);
    for (const det of [-5, 5]) { const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; o.detune.value = det; o.connect(g); o.start(); }
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.04 + k * 0.013; lg.gain.value = lv * 0.5; lfo.connect(lg); lg.connect(g.gain); lfo.start();
  });
  // 10 Hz between the ears, high enough for small speakers to carry
  [[200, -1], [210, 1]].forEach(([f, pan]) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.value = 0.035;
    if (ctx.createStereoPanner) { const pn = ctx.createStereoPanner(); pn.pan.value = pan; o.connect(g); g.connect(pn); pn.connect(master); } else { o.connect(g); g.connect(master); } o.start(); });

  // the melody
  const scale = [293.66, 329.63, 369.99, 415.30, 440.0, 493.88, 554.37, 587.33, 659.25];   // D lydian, D4 to E5
  const bell = (f, when, lv) => {
    const g = ctx.createGain(); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(lv, when + 0.015); g.gain.exponentialRampToValueAtTime(0.0005, when + 2.6); g.connect(bus);
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f; o.connect(g); o.start(when); o.stop(when + 2.7);
    const o2 = ctx.createOscillator(), g2 = ctx.createGain(); o2.type = "sine"; o2.frequency.value = f * 2.01; g2.gain.value = 0.25; o2.connect(g2); g2.connect(g); o2.start(when); o2.stop(when + 2.7);
  };
  let motif = [0, 2, 4, 3, 4, 6, 4, 2], round = 0, step = 0, next = ctx.currentTime + 0.4;
  const beat = 0.91;                                   // about 66 beats a minute
  const tick = setInterval(() => {
    while (next < ctx.currentTime + 0.6) {
      const n = motif[step];
      if (n != null) bell(scale[n], next, step % 4 === 0 ? 0.16 : 0.11);
      if (step === 7) {                                 // a long breath at the end of the phrase
        next += beat * 2; step = 0; round++;
        if (round % 2 === 0) {                          // every second time, change one note by a step: the same tune, slightly new
          const k = 1 + Math.floor(Math.random() * 6);
          motif = motif.slice(); motif[k] = Math.max(0, Math.min(8, motif[k] + (Math.random() < 0.5 ? -1 : 1)));
          if (round % 8 === 0) motif = [0, 2, 4, 3, 4, 6, 4, 2];   // and come home now and then
        }
      } else { next += beat; step++; }
    }
  }, 200);
  music = { ctx, master, tick, meter, level: 0.8 };
  musicLevel();
}
function musicLevel() {
  if (!music) return;
  const playing = (state.play && !state.play.ended) || (state.thread && !state.thread.ended);
  const target = state.sound && !playing ? music.level : 0;
  if (target > 0 && music.ctx.state === "suspended") music.ctx.resume();
  music.master.gain.setTargetAtTime(target, music.ctx.currentTime, 1.2);   // a slow fade, never a cut
}
function soundToggle() {
  state.sound = !state.sound;
  if (state.sound && !music) musicStart(); else musicLevel();
  render();
}

/* depth: cards lean toward the pointer, and settle when it leaves */
const motionOK = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
document.addEventListener("pointermove", ev => {
  if (!motionOK) return;
  const el = ev.target.closest("[data-tilt]"); if (!el) return;
  const r = el.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width - .5, y = (ev.clientY - r.top) / r.height - .5;
  el.style.setProperty("--ry", `${x * 10}deg`); el.style.setProperty("--rx", `${-y * 8}deg`);
});
document.addEventListener("pointerout", ev => { const el = ev.target.closest("[data-tilt]"); if (el) { el.style.setProperty("--ry", "0deg"); el.style.setProperty("--rx", "0deg"); } });

document.addEventListener("click", ev => {
  const t = ev.target;
  if (t.closest("[data-nojump]")) return;
  if (t.closest("[data-sound]")) return soundToggle();
  const ct = t.closest("[data-cat]"); if (ct) { state.cat = ct.dataset.cat; return render(); }
  const tl = t.closest("[data-tell]"); if (tl) { state.tell = tl.dataset.tell; state.swap = {}; store.set("tell", state.tell); store.set("swap", {}); return render(); }
  const sw = t.closest("[data-swap]"); if (sw) { const id = sw.dataset.swap, n = +sw.dataset.n; const cur = evening(findS(state.story)).eps.flatMap(e => e.videos).find(v => v.slot === id);
    const all = [id, ...findS(state.story).eps.flatMap(e => e.videos).find(v => v.id === id).alts.map(a => a.id)];
    state.swap[id] = (all.indexOf(cur ? cur.id : id) + 1) % n; store.set("swap", state.swap); stop(); return render(); }
  if (t.closest("[data-deeper-toggle]")) return deeperMenu();
  if (t.closest("[data-deeper-back]")) return deeperBack();
  const dg = t.closest("[data-deeper]"); if (dg) return deeperGo(+dg.dataset.deeper);
  const sd = t.closest("[data-side]"); if (sd) { state.side = sd.dataset.side; store.set("side", state.side); return render(); }
  const tk = t.closest("[data-track]"); if (tk) { stop(); threadStop(); state.view = "track"; state.story = tk.dataset.track;
    const p = trkPref(state.story); state.trkSince = p.seen; p.seen = new Date().toISOString().replace(/\.\d+Z$/, "Z"); trkSave(state.story, p); return render(); }
  const md = t.closest("[data-mode]"); if (md && state.view === "track") { const p = trkPref(state.story); p.mode = md.dataset.mode; trkSave(state.story, p); return render(); }
  const sd2 = t.closest("[data-said]"); if (sd2) { const [k, id] = sd2.dataset.said.split(":"); const p = trkPref(state.story); p.said[id] = k; trkSave(state.story, p); return render(); }
  const on1 = t.closest("[data-one]"); if (on1) return playOne(on1.dataset.one);
  if (state.one) {
    if (t.closest("[data-next]")) return oneStep(1);
    if (t.closest("[data-prev]")) return oneStep(-1);
    if (t.closest("[data-stop]")) { stop(); return render(); }
  }
  const ln = t.closest("[data-lens]"); if (ln) { state.lens = ln.dataset.lens; store.set("lens", state.lens); return render(); }
  const tp = t.closest("[data-thread-play]"); if (tp) { stop(); threadStop(); state.view = "thread"; state.story = tp.dataset.threadPlay; render(); return threadStart(0); }
  const thr = t.closest("[data-thread]"); if (thr) { stop(); threadStop(); state.view = "thread"; state.story = thr.dataset.thread; return render(); }
  const sgc = t.closest("[data-seg]"); if (sgc) return threadStart(+sgc.dataset.seg);
  if (state.thread && !state.thread.ended) {
    if (t.closest("[data-next]")) return threadNext();
    if (t.closest("[data-prev]")) return threadStart(Math.max(0, state.thread.i - 1));
    if (t.closest("[data-stop]")) { threadStop(); dock().classList.remove("big"); render(); return; }
  }
  const go = t.closest("[data-go]"); if (go) { stop(); threadStop(); state.view = go.dataset.go; state.story = null; return render(); }
  const b = t.closest("[data-budget]"); if (b) { state.budget = +b.dataset.budget; store.set("budget", state.budget); return render(); }
  const open = t.closest("[data-open]"); if (open) { stop(); state.view = "series"; state.story = open.dataset.open; return render(); }
  const srt = t.closest("[data-sort]"); if (srt) { stop(); state.view = "sorting"; state.story = srt.dataset.sort; return render(); }
  const ps = t.closest("[data-play-story]"); if (ps) { stop(); state.view = "series"; state.story = ps.dataset.playStory; return startAt(0, 0); }
  const pa = t.closest("[data-play-at]"); if (pa) { const [a_, b_] = pa.dataset.playAt.split(":").map(Number); stop(); return startAt(a_, b_); }
  if (t.closest("[data-size]")) { dock().classList.toggle("big"); return dockSync(); }
  const st = t.closest("[data-start]"); if (st) { stop(); return startAt(+st.dataset.start, 0); }
  const rs = t.closest("[data-resume]"); if (rs) { const r = store.get("resume." + state.story, { ep: 0, i: 0 }); stop(); return startAt(r.ep, r.i); }
  if (state.play && state.play.detour && (t.closest("[data-next]") || t.closest("[data-prev]"))) return deeperBack();
  if (t.closest("[data-next]")) { const p = state.play; if (!p || p.ended) return; if (p.interstitial) return startAt(p.ep, 0); markSeen(p.e.eps[p.ep].videos[p.i]); return advance(p.e); }
  if (t.closest("[data-prev]")) { const p = state.play; if (!p || p.ended) return; if (p.i > 0) return startAt(p.ep, p.i - 1); if (p.ep > 0) return startAt(p.ep - 1, Math.max(0, p.e.eps[p.ep - 1].videos.length - 1)); return; }
  if (t.closest("[data-stop]")) { stop(); return render(); }
  const sn = t.closest("[data-seen]"); if (sn) { const id = sn.dataset.seen; state.seen.has(id) ? state.seen.delete(id) : state.seen.add(id); store.set("seen", [...state.seen]); return render(); }
});
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".turn[data-seg]")) { ev.preventDefault(); threadStart(+ev.target.dataset.seg); } else if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-one]")) { ev.preventDefault(); playOne(ev.target.dataset.one); } });
document.addEventListener("change", ev => { if (ev.target.id === "skipseen") { state.skipSeen = ev.target.checked; store.set("skipSeen", state.skipSeen); render(); } });
render();
loadYT();   // ready before the first tap, so that tap is the one that plays
</script>
