name: Weekly search sweep

# Catches what the channel sweep cannot: uploads from channels that are not yet
# in the ledger. It searches each narrative's queries, appends what is new as
# UNREVIEWED and commits. Nothing already in a corpus is changed.
#
# It runs WEEKLY, not daily, because search.list is capped at 100 calls a day
# and is the only way to reach channels we do not know. Daily collection is
# channel-sweep.yml. Requires YT_API_KEY: without it the sweep stops rather than
# reading YouTube's pages (decision 2026-09-16, API only).

on:
  schedule:
    - cron: "30 5 * * 1"     # Mondays 05:30 UTC. Search is capped at 100 calls a day and is the
                             # only way to find new channels, so the daily collection now runs on
                             # channel uploads (channel-sweep.yml) and search runs weekly.
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for uploads"
        default: "14"

permissions:
  contents: write

concurrency:
  group: corpus-daily
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep every narrative for new uploads
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/daily_sweep.py --write --days=${{ github.event.inputs.days || '14' }} | tee sweep.log

      - name: Commit and push new videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if git diff --quiet -- corpus; then
            echo "No new videos today."
            exit 0
          fi
          git config user.name  "narrative-radar-sweep"
          git config user.email "sweep@users.noreply.github.com"
          SUMMARY="$(tail -n 1 sweep.log)"
          git add corpus/*/videos.json
          # [skip netlify] keeps a data commit from triggering a function redeploy.
          git commit -m "Daily sweep $(date -u +%Y-%m-%d): ${SUMMARY} [skip netlify]"
          # The engine and local sessions also push to main. If this push loses
          # the race, start again from the new main: the sweep is idempotent.
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            python3 scripts/daily_sweep.py --write --days=${{ github.event.inputs.days || '14' }} > /dev/null
            git diff --quiet -- corpus && exit 0
            git add corpus/*/videos.json
            git commit -m "Daily sweep $(date -u +%Y-%m-%d): ${SUMMARY} (retry ${attempt}) [skip netlify]"
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat sweep.log 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
