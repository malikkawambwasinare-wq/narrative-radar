name: Channel sweep

# The daily collection route. Reads every channel in the ledger — all 7,000, not
# a tier — for what they published in the last two days, files what matches a
# tracked narrative, pools the claim-carrying rest, and archives everything else
# so that a video we cannot place yet is still recorded as having existed.
#
# The quota arithmetic that makes the whole ledger affordable: uploads_items
# stops paging the moment it reaches a video older than the cutoff, so at
# --days=2 almost every channel costs exactly 1 unit of the 10,000. Seven
# thousand channels plus detail lookups lands near 7,200, which is why this can
# run daily over the entire ledger where the old tier-A-only, ten-page defaults
# could not. Deep backfills belong in full-crawl.yml, not here.
#
# Spends no search calls, so the 100 daily searches stay free for discovering
# channels and narratives we do not know yet. Official API only (2026-09-16).

on:
  schedule:
    - cron: "0 8 * * *"        # 08:00 UTC: just after the API quota resets at 07:00 UTC (midnight Pacific).
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of uploads to read"
        default: "2"
      tiers:
        description: "Ledger tiers to sweep (ABC is the whole ledger)"
        default: "ABC"
      write:
        description: "Append to the corpora (false = dry run)"
        default: "true"
      calls:
        description: "Discovery search calls to spend (of the 100 daily)"
        default: "40"
      pages:
        description: "Upload pages per channel, 50 each (2 = a daily catch-up, 10 = a backfill)"
        default: "2"
      full:
        description: "Whole history per channel, resuming where the last run stopped"
        default: "false"
      units:
        description: "Stop after this many quota units (the daily allowance is 10,000)"
        default: "9000"
      max_channels:
        description: "How many channels this run may read (the ledger holds ~7,000)"
        default: "8000"
      archive:
        description: "Record every upload seen, including ones we cannot place"
        default: "true"

permissions:
  contents: write

concurrency:
  group: channel-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # a full-history crawl runs for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cheap and first: ~60 quota units, and if the sweep later exhausts the
      # day's allowance we still have the board. X is skipped silently when no
      # token is set, so this costs nothing until you decide it should.
      - name: What is trending, on YouTube and on X
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 scripts/trending.py --write || true

      # Quota decision 2026-09-21: upload polling moved to the free RSS firehose
      # (scripts/firehose.py, local). This sweep keeps a 2,500-unit cap and the
      # discovery searches 10 calls, so scripts/discover.py can spend ~6,000 a day
      # at the 07:00 UTC reset. Raise via workflow inputs for a one-off.
      - name: Read the ledger's channels for new uploads
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/channel_sweep.py \
            --days=${{ inputs.days || '2' }} \
            --tiers=${{ inputs.tiers || 'ABC' }} \
            --pages=${{ inputs.pages || '2' }} \
            ${{ (inputs.archive == 'false') && ' ' || '--archive' }} \
            ${{ (inputs.full == 'true') && '--full' || ' ' }} \
            --units=${{ inputs.units || '2500' }} \
            --max=${{ inputs.max_channels || '8000' }} \
            ${{ (inputs.write == 'false') && ' ' || '--write' }} | tee sweep.log

      - name: Spend the day's discovery searches
        if: ${{ always() && inputs.write != 'false' }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/discovery_search.py --calls=${{ inputs.calls || '10' }} --days=7 --write

      - name: Fill in runtimes for videos that arrived without them
        if: ${{ always() && inputs.write != 'false' }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/fill_details.py --write --max=8000

      - name: Re-file the pool against every narrative
        if: ${{ always() && inputs.write != 'false' }}
        run: python3 scripts/refile_pool.py --write

      - name: Queue channels that people pasted and we do not hold
        if: ${{ always() && inputs.write != 'false' }}
        run: python3 scripts/paste_queue.py --write

      - name: Keep the numbers in the titles true
        if: always()
        run: |
          python3 scripts/title_refresh.py --write || true
          python3 scripts/title_check.py || true

      - name: Rebuild the ledger and the discovered claims
        if: ${{ always() && inputs.write != 'false' }}
        run: |
          python3 scripts/channel_ledger.py --write
          python3 scripts/discover_narratives.py --write

      # Belt and braces. The commit step can itself fail — a push conflict, a
      # bad token — and a runner is destroyed the moment the job ends. An
      # artifact means a run's reading is downloadable even then.
      - name: Keep what was read, whatever else happens
        if: ${{ always() && inputs.write != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_id }}
          path: |
            corpus/**/videos.json
            archive/*.json
            trending/*.json
            crawl-state.json
            discovery-pool.json
            sweep.log
          retention-days: 14
          if-no-files-found: warn

      - name: Commit what changed
        if: ${{ always() && inputs.write != 'false' }}
        run: |
          git config user.name "narrative-radar-bot"
          git config user.email "actions@github.com"
          SUMMARY=$(tail -n 1 sweep.log)
          git add corpus archive trending channels.json discovered.json channel-candidates.json discovery-pool.json crawl-state.json watchlist.json
          if git diff --cached --quiet; then
            echo "nothing new today"
            exit 0
          fi
          git commit -m "Channel sweep $(date -u +%F): ${SUMMARY} [skip netlify]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "push failed after three attempts"
          exit 1
