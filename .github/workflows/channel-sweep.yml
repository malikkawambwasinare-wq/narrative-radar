name: Channel sweep

# The daily collection route. Reads the uploads of every channel in the ledger's
# chosen tiers and files the ones that carry a tracked narrative. Costs 1 quota
# unit per 50 uploads from the 10,000 bucket and spends no search calls, so the
# 100 daily searches stay free for discovering channels and narratives we do not
# know yet. Official API only (decision 2026-09-16).

on:
  schedule:
    - cron: "0 8 * * *"        # 08:00 UTC: just after the API quota resets at 07:00 UTC (midnight Pacific).
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of uploads to read"
        default: "7"
      tiers:
        description: "Ledger tiers to sweep (A, AB)"
        default: "A"
      write:
        description: "Append to the corpora (false = dry run)"
        default: "true"
      calls:
        description: "Discovery search calls to spend (of the 100 daily)"
        default: "40"
      pages:
        description: "Upload pages per channel, 50 each (2 = a screen, 10 = a backfill)"
        default: "10"
      full:
        description: "Whole history per channel, resuming where the last run stopped"
        default: "false"
      units:
        description: "Stop after this many quota units (the daily allowance is 10,000)"
        default: "8500"
      max_channels:
        description: "How many channels this run may read (tier B is thousands)"
        default: "400"

permissions:
  contents: write

concurrency:
  group: channel-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # a full-history crawl runs for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the ledger's channels for new uploads
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/channel_sweep.py \
            --days=${{ inputs.days || '7' }} \
            --tiers=${{ inputs.tiers || 'A' }} \
            --pages=${{ inputs.pages || '10' }} \
            ${{ (inputs.full == 'true') && '--full' || ' ' }} \
            --units=${{ inputs.units || '8500' }} \
            --max=${{ inputs.max_channels || '400' }} \
            ${{ (inputs.write == 'false') && ' ' || '--write' }} | tee sweep.log

      - name: Spend the day's discovery searches
        if: ${{ always() && inputs.write != 'false' }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/discovery_search.py --calls=${{ inputs.calls || '40' }} --days=7 --write

      - name: Fill in runtimes for videos that arrived without them
        if: ${{ always() && inputs.write != 'false' }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/fill_details.py --write --max=8000

      - name: Re-file the pool against every narrative
        if: ${{ always() && inputs.write != 'false' }}
        run: python3 scripts/refile_pool.py --write

      - name: Queue channels that people pasted and we do not hold
        if: ${{ always() && inputs.write != 'false' }}
        run: python3 scripts/paste_queue.py --write

      - name: Keep the numbers in the titles true
        if: always()
        run: |
          python3 scripts/title_refresh.py --write || true
          python3 scripts/title_check.py || true

      - name: Rebuild the ledger and the discovered claims
        if: ${{ always() && inputs.write != 'false' }}
        run: |
          python3 scripts/channel_ledger.py --write
          python3 scripts/discover_narratives.py --write

      # Belt and braces. The commit step can itself fail — a push conflict, a
      # bad token — and a runner is destroyed the moment the job ends. An
      # artifact means a run's reading is downloadable even then.
      - name: Keep what was read, whatever else happens
        if: ${{ always() && inputs.write != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_id }}
          path: |
            corpus/**/videos.json
            crawl-state.json
            discovery-pool.json
            sweep.log
          retention-days: 14
          if-no-files-found: warn

      - name: Commit what changed
        if: ${{ always() && inputs.write != 'false' }}
        run: |
          git config user.name "narrative-radar-bot"
          git config user.email "actions@github.com"
          SUMMARY=$(tail -n 1 sweep.log)
          git add corpus channels.json discovered.json channel-candidates.json discovery-pool.json crawl-state.json watchlist.json
          if git diff --cached --quiet; then
            echo "nothing new today"
            exit 0
          fi
          git commit -m "Channel sweep $(date -u +%F): ${SUMMARY} [skip netlify]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "push failed after three attempts"
          exit 1
