name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A commit pushed by a workflow using the default token does NOT trigger other
  # workflows, so the sweeps' own commits never published. Running after those
  # workflows finish does work, and it is why the site now updates itself.
  workflow_run:
    workflows: ["Channel sweep", "Naming pass", "Weekly search sweep", "Resolver"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
